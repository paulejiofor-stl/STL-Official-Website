<section class="relative isolate overflow-hidden pt-[72px]">
  <div class="grid-bg absolute inset-0 -z-10"></div>
  <div class="absolute -right-32 -top-10 -z-10 h-[28rem] w-[28rem] rounded-full bg-signal/20 blur-[120px]"></div>
  <div class="container pb-16 pt-16 sm:pb-20 sm:pt-24">
    <div class="max-w-3xl">
      <span class="eyebrow" data-reveal>{{eyebrow}}</span>
      <h1 class="h-display mt-6" data-reveal style="--d:.05s">{{heading}}</h1>
      <p class="lead mt-6 max-w-2xl" data-reveal style="--d:.1s">{{intro}}</p>
    </div>
  </div>
</section>
