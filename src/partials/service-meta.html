<div class="mt-4 grid gap-4 md:grid-cols-2" data-reveal>
  <div class="rounded-2xl border border-line p-7">
    <h3 class="text-sm font-semibold uppercase tracking-[0.14em] !text-slate-400">Who it’s for</h3>
    <ul class="check-list mt-4 space-y-2.5 text-[15px]">{{list:who}}</ul>
  </div>
  <div class="rounded-2xl border border-line bg-mist p-7">
    <h3 class="text-sm font-semibold uppercase tracking-[0.14em] !text-slate-400">The outcome</h3>
    <p class="mt-4 font-display text-xl font-semibold leading-snug text-navy">{{outcome}}</p>
  </div>
</div>
